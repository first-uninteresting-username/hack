name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: "Version tag to be released. This project uses zenver"

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: matrix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          installCommand: "nix profile add nixpkgs#cachix"

      - name: Create tag
        run: git push origin "HEAD:refs/tags/${{ inputs.version }}"

      - name: Update flake.lock
        run: nix flake update

      - name: Update package
        run: |
          nix run nixpkgs#nix-update -- \
            --flake --version "${{ inputs.version }}" hack

      - name: Verify the package actually moved
        run: |
          git --no-pager diff -- nix/package.nix
          if git diff --quiet -- nix/package.nix; then
            echo "::error::nix-update did not touch nix/package.nix meaning the package is stalled"
            exit 1
          fi

      - name: Build package
        run: nix build .#hack

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            result/bin/hack
          generate_release_notes: true
          tag_name: "${{ inputs.version }}"
          body: |
            Built for Linux x86-64 (amd64). Download `hack`, then:

            ```bash
            chmod +x ./hack
            ./hack
            ```

      - name: Bump version in root.go
        run: |
          sed -i 's/Version: "[0-9]*"/Version: "${{ inputs.version }}"/' cmd/root.go

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        id: create-pr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(nix): update hack package and flake.lock"
          branch: update-nix-package
          base: main
          delete-branch: true
          title: "chore(nix): update hack package"
          body: |
            Automated update triggered by the [release workflow run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            This bumps `nix/package.nix` (via `nix-update`) and refreshes `flake.lock`.
          labels: |
            dependencies
            automated

      - name: Enable pull request auto-merge
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
          merge-method: squash
